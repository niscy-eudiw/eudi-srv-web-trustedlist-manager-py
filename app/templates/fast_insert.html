<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast Insert Trust Services</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <script>
        function generateServiceTypes() {
            const count = document.getElementById("service_count").value;
            const container = document.getElementById("service_list");
            const options = JSON.parse('{{ services | tojson }}');

            container.innerHTML = "";
            for (let i = 0; i < count; i++) {
                let select = document.createElement("select");
                select.className = "form-select mt-2";
                select.name = "service_type_" + i;
                select.required = true;

                options.forEach(opt => {
                    let op = document.createElement("option");
                    op.value = opt;
                    op.textContent = opt;
                    select.appendChild(op);
                });

                container.appendChild(select);
            }
        }
    </script>

</head>
<body class="container mt-4">

    <h2>Fast Insert - Trust Services</h2>
    <hr>

    <form method="POST">

        <!-- LANG -->
        <div class="mb-3">
            <label class="form-label">Country (lang)</label>
            <select name="lang" class="form-select" required>
                {% for c in eu_countries %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Country Code -->
        <div class="mb-3">
            <label class="form-label">Country Code</label>
            <input type="text" name="country_code" class="form-control" required>
        </div>


        <!-- OPERATOR ID -->
        <div class="mb-3">
            <label class="form-label">Operator ID</label>
            <input type="number" name="operator_id" class="form-control" required>
        </div>

        <!-- SERVICE NUMBER FOR THE NAME -->
        <div class="mb-3">
            <label class="form-label">Service Number</label>
            <input type="number" name="service_number" class="form-control" required>
            <small class="text-muted">Usado para criar o Service Name</small>
        </div>

        <!-- SERVICE COUNT -->
        <div class="mb-3">
            <label class="form-label">How many services?</label>
            <input type="number" id="service_count" name="service_count" class="form-control"
                   min="1" value="1" onchange="generateServiceTypes()" required>
        </div>

        <!-- SERVICE SELECTS GENERATED -->
        <div id="service_list"></div>

        <script>
            generateServiceTypes();
        </script>

        <!-- CERTIFICATES -->
        <div class="mb-3 mt-3">
            <label class="form-label">Certificates (x5c)</label>
            <textarea name="certificates" class="form-control" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Insert</button>

    </form>

</body>
</html>
